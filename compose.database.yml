name: huertos-medicinales-local
services:
  postgres:
    image: postgres@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    env_file: .env
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - huertos_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  huertos_postgres:
