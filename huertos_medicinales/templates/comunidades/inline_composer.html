<form method="post" enctype="multipart/form-data" action="{% url 'comunidades:nueva_pregunta' %}?social=1&destino={% if selected_group %}grupo{% else %}general{% endif %}" data-inline-composer>{% csrf_token %}<input type="hidden" name="inline" value="1"><input type="hidden" name="social" value="1"><input type="hidden" name="adjunto" value=""><input type="hidden" name="tipo" value="experiencia"><input type="hidden" name="comunidad" value="{{ selected_group.pk|default:'' }}">
<div class="social-compose-prompt"><span class="community-avatar">{{ nombre_cabecera|slice:':1' }}</span><textarea name="contenido" rows="1" maxlength="5000" aria-label="¿Qué estás cultivando hoy?" placeholder="¿Qué estás cultivando hoy? Comparte una pregunta, experiencia o consejo…"></textarea></div>
{% if selected_group %}<label>Quién puede verlo <select name="visibilidad"><option value="publico">Público</option><option value="privado">Solo mi comunidad</option></select></label>{% else %}<input type="hidden" name="visibilidad" value="publico">{% endif %}
<div class="inline-attachments"><input type="file" name="foto" accept="image/jpeg,image/png,image/webp" hidden><div data-inline-foto hidden><img alt="Vista previa de la foto"><button type="button" data-remove-file="foto">Quitar foto ×</button></div><div data-inline-panel="enlace" hidden><label>Enlace <input type="url" name="enlace" placeholder="https://…" maxlength="600" disabled></label><button type="button" data-toggle-panel="enlace">Quitar enlace ×</button></div><div data-inline-panel="encuesta" hidden><label>Pregunta <input name="titulo" maxlength="180" placeholder="¿Qué quieres preguntar?" disabled></label><label>Opciones <textarea name="opciones_encuesta" rows="3" placeholder="Una opción por línea (de 2 a 6)" disabled></textarea></label><button type="button" data-toggle-panel="encuesta">Quitar encuesta ×</button></div></div>
<div class="social-compose-actions"><button type="button" data-pick-file="foto">▧ Foto</button><button type="button" data-toggle-panel="enlace">↗ Enlace</button><button type="button" data-toggle-panel="encuesta">▥ Encuesta</button><button type="submit" class="purple-button">➤ Publicar</button></div><p data-inline-status role="status" aria-live="polite" hidden></p></form>
