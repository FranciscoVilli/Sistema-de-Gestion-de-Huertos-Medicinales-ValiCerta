<fieldset class="edu-question"><legend>{{ question.enunciado }}</legend>{% if question.multiple %}<p class="edu-small">Selecciona todas las respuestas que correspondan.</p>{% endif %}{% for option in question.options %}<label class="answer-option"><input type="{% if question.multiple %}checkbox{% else %}radio{% endif %}" name="{{ question.key }}" value="{{ option.value }}" {% if not question.multiple %}required{% endif %}><span>{{ option.label }}</span></label>{% endfor %}</fieldset>
