<aside class="sidebar" aria-label="Navegación de Huertos"><a class="brand" href="{% url 'workspace' %}"><svg aria-hidden="true"><use href="#i-sprout" /></svg><span>Huertos<br />Medicinales</span></a><nav aria-label="Menú principal">
  {% with route=request.resolver_match.url_name namespace=request.resolver_match.namespace %}
    <a href="{% url 'workspace' %}"
       {% if route == 'workspace' or route == 'garden_new' or route == 'garden_place' or namespace == 'seguimiento' %}class="active" aria-current="page"{% endif %}><svg aria-hidden="true"><use href="#i-home" /></svg>Inicio</a>
    <a href="{% url 'learning' %}"
       {% if route == 'learning' or route == 'learning_plant' or route == 'learning_lesson' or 'lms_' in route %}class="active" aria-current="page"{% endif %}><svg aria-hidden="true"><use href="#i-book" /></svg>Aprender</a>
    <a href="{% url 'calendar' %}"
       {% if 'calendar' in route %}class="active" aria-current="page"{% endif %}><svg aria-hidden="true"><use href="#i-calendar" /></svg>Calendario</a>
    <a href="{% url 'comunidades:listado' %}"
       {% if namespace == 'comunidades' %}class="active" aria-current="page"{% endif %}><svg aria-hidden="true"><use href="#i-people" /></svg>Comunidad y mapa</a>
    {% if request.user.is_staff %}<a href="{% url 'admin:index' %}"><svg aria-hidden="true"><use href="#i-people" /></svg>Administración</a>{% endif %}
  {% endwith %}
  </nav>
  <svg class="sidebar-leaf" aria-hidden="true">
    <use href="#i-leaf-sprig" />
  </svg>
</aside>
