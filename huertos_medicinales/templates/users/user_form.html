{% extends "base.html" %}

{% load crispy_forms_tags %}

{% block title %}


  Editar mi nombre


{% endblock title %}
{% block content %}
  <h1>
  
  
    Editar mi nombre
  
  
</h1>
<form class="form-horizontal"
      method="post"
      action="{% url 'users:update' %}">
  {% csrf_token %}
  {{ form|crispy }}
  <div class="control-group">
    <div class="controls">
      <button type="submit" class="btn btn-primary">Guardar cambios</button>
    </div>
  </div>
<a class="text-link" href="{% url 'users:detail' request.user.pk %}">Volver a mi cuenta</a></form>
{% endblock content %}
