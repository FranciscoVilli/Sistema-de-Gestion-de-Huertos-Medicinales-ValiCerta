{% if request and not cookies_elegidas %}<aside class="cookie-banner" aria-labelledby="cookie-title"><div><h2 id="cookie-title">Tu privacidad, tu elección</h2><p>Usamos cookies necesarias para la sesión y la seguridad. Los mapas externos permanecen desactivados hasta que los permitas.</p><a href="{% url 'privacidad:cookies' %}">Consultar cookies y configuración</a></div><form method="post" action="{% url 'privacidad:guardar_cookies' %}" class="cookie-actions">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"><button type="submit" class="cookie-choice" name="eleccion" value="necesarias">Solo necesarias</button><button type="submit" class="cookie-choice" name="eleccion" value="mapas">Permitir mapas</button></form></aside>{% endif %}
