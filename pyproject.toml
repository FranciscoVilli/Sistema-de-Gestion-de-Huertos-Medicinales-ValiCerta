[project]
name = "huertos-medicinales"
version = "0.1.0"
description = """\
  Sistema de huertos medicinales comunitarios con aprendizaje practico, bitacoras y participacion comunitaria.\
  """
readme = "README.md"
license = { text = "Not open source" }
authors = [
  { name = "Equipo Huertos Medicinales", email = "equipo@example.com" },
]
requires-python = "==3.14.*"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "argon2-cffi==25.1.0",
  "crispy-bootstrap5==2026.9",
  "django==6.0.9",
  "django-allauth[mfa]==65.19.7",
  "django-anymail==15.2",
  "django-crispy-forms==2.7",
  "django-environ==0.14.0",
  "django-model-utils==5.0.0",
  "django-redis==7.0.0",
  "gunicorn==26.2.0",
  "hiredis==3.4.2",
  "pillow==13.0.0",
  "psycopg[binary]==3.3.6; sys_platform=='win32'",
  "psycopg[c]==3.3.6; sys_platform!='win32'",
  "python-slugify==9.1.3",
  "redis==8.1.0",
  "requests>=2.34.2",
  "whitenoise==6.12.0",
]

[dependency-groups]
dev = [
  "coverage==7.16.2",
  "django-coverage-plugin==3.2.2",
  "django-debug-toolbar==8.0.0",
  "django-extensions==4.1",
  "django-stubs[compatible-mypy]==6.1.2",
  "django-upgrade==1.33.0",
  "djlint==1.46.4",
  "factory-boy==3.3.3",
  "ipdb==0.13.13",
  "mypy==2.4.0",
  "pre-commit==4.7.0",
  "psycopg[binary]==3.3.6",
  "pytest==9.1.1",
  "pytest-django==4.14.0",
  "pytest-sugar==1.1.1",
  "ruff==0.17.0",
  "sphinx==9.1.0",
  "sphinx-autobuild==2025.8.25",
  "werkzeug[watchdog]==3.1.9",
]

# ==== djLint ====
[tool.djlint]
profile = "django"
include = "H017,H035"
indent = 2
max_line_length = 119
blank_line_after_tag = "load,extends"
close_void_tags = true
format_css = true
format_js = true
custom_blocks = "element,slot"
# H043: los botones sin `type` dependen de no coincidir con `.app-shell button[type=submit]`
# (app-ui.css), que los pintaria como boton primario. Activarla exige antes darles clases propias.
ignore = "H006,H030,H031,H043"
css.indent_size = 2
js.indent_size = 2
# H021: el porcentaje de avance llega como variable CSS en linea (style="--progress:…").
# H020: el <i> vacio es el punto de color de cada actividad, dibujado por calendario.css.
per-file-ignores."huertos_medicinales/templates/aprendizaje/block_detail.html" = "H021"
per-file-ignores."huertos_medicinales/templates/pages/learning.html" = "H021"
per-file-ignores."huertos_medicinales/templates/panel/calendario.html" = "H020"

# ==== ruff ====
[tool.ruff]
# Exclude a variety of commonly ignored directories.
extend-exclude = [
  "*/migrations/*.py",
  "staticfiles/*",
]
lint.select = [
  "A",
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "C90",
  "COM",
  "DJ",
  "DTZ",
  "E",
  "EM",
  "ERA",
  "EXE",
  "F",
  "FA",
  "FBT",
  "FLY",
  "G",
  "I",
  "ICN",
  "INP",
  "INT",
  "ISC",
  "N",
  "PD",
  "PERF",
  "PGH",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "PYI",
  "Q",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "SLF",
  "SLOT",
  "T10",
  "T20",
  "TC",
  "TID",
  "TRY",
  "UP",
  "W",
  "YTT",
]
lint.ignore = [
  "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
  "S101",   # Use of assert detected https://docs.astral.sh/ruff/rules/assert/
  "SIM102", # sometimes it's better to nest
  # of types for comparison.
  # Deactivated because it can make the code slow:
  # https://github.com/astral-sh/ruff/issues/7871
]
# En las pruebas, los valores esperados (codigos HTTP, conteos, fechas) son
# justamente el dato que se verifica; convertirlos en constantes no aporta claridad.
lint.per-file-ignores."**/test_*.py" = [ "PLR2004" ]
lint.per-file-ignores."**/tests.py" = [ "PLR2004" ]
lint.per-file-ignores."**/tests/*.py" = [ "PLR2004" ]
lint.isort.force-single-line = true

# ==== pyproject-fmt ====
[tool.pyproject-fmt]
keep_full_version = true

# ==== mypy ====
[tool.mypy]
ignore_missing_imports = true
python_version = "3.14"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = [
  "mypy_django_plugin.main",
]
warn_unused_configs = true
overrides = [
  # Django migrations should not produce any errors:
  { module = "*.migrations.*", ignore_errors = true }
]

[tool.django-stubs]
django_settings_module = "config.settings.test"

# ==== pytest ====
[tool.pytest]
addopts = [
  "--ds=config.settings.test",
  "--reuse-db",
  "--import-mode=importlib",
]
minversion = "9.0"
python_files = [
  "tests.py",
  "test_*.py",
]

[tool.coverage]
# ==== Coverage ====
run.include = [ "huertos_medicinales/**" ]
run.omit = [ "*/migrations/*", "*/tests/*" ]
run.plugins = [ "django_coverage_plugin" ]
